{% load core_tags %}<div class="ta-fila ta-{{ nodo.tipo }}"{% if nodo.tipo == "item" %} data-padre="{{ nodo.padre_id }}"{% endif %}>
  <div class="ta-num">{% if nodo.tipo == "rubro" and nodo.hijos_lista %}<button type="button" class="btn-plegar" data-plegar="{{ nodo.id }}" aria-expanded="true" title="Contraer / expandir ítems"><i class="bi bi-chevron-down"></i></button>{% endif %}{{ nodo.numero }}</div>
  <div class="ta-nombre">{{ nodo.nombre }}</div>
  <div class="ta-inc" title="Incidencia dentro de su grupo">{{ nodo.incidencia|pct }}%</div>
  <div class="ta-avance" title="Peso en el total">
    <div class="progress flex-grow-1" style="height: 8px"><div class="progress-bar bg-secondary" style="width: {{ nodo.peso_total|stringformat:'.2f' }}%"></div></div>
    <span class="ta-av-num">{{ nodo.peso_total|pct }}%</span>
  </div>
</div>
{% for hijo in nodo.hijos_lista %}{% include "plantillas/_nodo.html" with nodo=hijo %}{% endfor %}
