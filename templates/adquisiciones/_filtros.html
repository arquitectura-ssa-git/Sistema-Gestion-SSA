<form class="row g-2 mb-3 align-items-end" method="get">
  <div class="col-12 col-lg-3"><label class="form-label small text-muted mb-1" for="buscar">Buscar</label><input type="search" name="q" id="buscar" value="{{ filtro.q }}" class="form-control" placeholder="Código, qué se pide, ítem"></div>
  <div class="col-12 col-sm-auto">
    <label class="form-label small text-muted mb-1" for="f-obra">Obra o proyecto</label>
    <select name="obra" id="f-obra" class="form-select" onchange="this.form.submit()">
      <option value="">Todas</option>
      {% for o in obras %}<option value="{{ o.pk }}" {% if o.pk|stringformat:"s" == filtro.obra %}selected{% endif %}>{{ o.codigo }} · {{ o.nombre }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-sm-auto">
    <label class="form-label small text-muted mb-1" for="f-tipo">Tipo</label>
    <select name="tipo" id="f-tipo" class="form-select" onchange="this.form.submit()">
      <option value="">Todos</option>
      {% for v, t in tipos %}<option value="{{ v }}" {% if v == filtro.tipo %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select>
  </div>
  {% if estados %}
  <div class="col-6 col-sm-auto">
    <label class="form-label small text-muted mb-1" for="f-estado">Estado</label>
    <select name="estado" id="f-estado" class="form-select" onchange="this.form.submit()">
      <option value="abiertos" {% if filtro.estado == "abiertos" %}selected{% endif %}>Abiertos</option>
      <option value="todos" {% if filtro.estado == "todos" %}selected{% endif %}>Todos</option>
      {% for v, t in estados %}<option value="{{ v }}" {% if v == filtro.estado %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select>
  </div>
  {% endif %}
  <div class="col-auto"><button class="btn btn-outline-secondary" aria-label="Buscar"><i class="bi bi-search"></i></button></div>
</form>
